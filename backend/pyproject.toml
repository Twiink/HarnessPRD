[project]
name = "harnessprd-backend"
version = "0.1.0"
description = "HarnessPRD FastAPI backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "langchain>=0.1.0",
  "langchain-anthropic>=0.1.0,<0.3.0",
  "langchain-openai>=0.0.5",
  "python-dotenv>=1.0.0",
  "httpx>=0.25.0",
  "python-multipart>=0.0.6",
  "tiktoken>=0.7.0",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.11.0,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F401", "F841"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

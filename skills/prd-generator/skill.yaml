name: prd-generator
description: Generate a structured PRD in Markdown from a concise product requirements summary.
version: 0.1.0
input:
  format: json
  schema: references/field-schema.json
  required:
    - product_name
    - product_goal
    - target_users
    - platform
    - mvp_features
output:
  format: markdown
  template: references/prd-template.md
  style:
    - concise
    - execution-oriented
    - low-redundancy
    - structured-first
defaults:
  missing_value: 待确认
constraints:
  - Do not invent business facts that are not supported by the input.
  - Keep every section useful for product, design, and engineering handoff.
  - Prefer tables for MVP features instead of long paragraphs.
  - Keep technical decisions explicit when confirmed and labeled as suggestions when inferred.
  - Preserve the fixed PRD section structure defined by the template.
workflow:
  - validate_input
  - normalize_requirements
  - deduplicate_content
  - map_to_template
  - render_prd
quality_checks:
  - All required sections are present.
  - MVP features are rendered as a table.
  - Scope and out-of-scope are mutually consistent.
  - Missing critical information is marked as 待确认.
artifacts:
  instructions: instructions.md
  references:
    - references/prd-template.md
    - references/field-schema.json
    - references/writing-rules.md
    - references/examples/friend-circle-copywriter.input.json
    - references/examples/friend-circle-copywriter.output.md
